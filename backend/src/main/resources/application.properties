spring.application.name=backend

# Embedded H2 database stored in a file, so data survives restarts.
# Override with the CALENDAR_DB_URL environment variable if needed.
spring.datasource.url=${CALENDAR_DB_URL:jdbc:h2:file:./data/calendar}
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
