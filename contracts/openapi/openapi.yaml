openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.0
tags: []
paths:
  /actuator/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
